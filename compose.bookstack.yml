services:
  bookstack-db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: bookstack
      MARIADB_USER: bookstack
      MARIADB_PASSWORD: ${BOOKSTACK_DB_PASSWORD:?Set BOOKSTACK_DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${BOOKSTACK_DB_ROOT_PASSWORD:?Set BOOKSTACK_DB_ROOT_PASSWORD in .env}
    volumes:
      - bookstack-db-data:/var/lib/mysql
    networks: [bookstack-db]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    security_opt: ["no-new-privileges:true"]

  bookstack:
    image: lscr.io/linuxserver/bookstack:latest
    restart: unless-stopped
    depends_on:
      bookstack-db:
        condition: service_healthy
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: ${TZ:-America/New_York}
      APP_URL: ${BOOKSTACK_APP_URL:-http://localhost:6875}
      APP_KEY: ${BOOKSTACK_APP_KEY:?Generate with scripts/bookstack-key.sh and set in .env}
      DB_HOST: bookstack-db
      DB_PORT: "3306"
      DB_DATABASE: bookstack
      DB_USERNAME: bookstack
      DB_PASSWORD: ${BOOKSTACK_DB_PASSWORD:?Set BOOKSTACK_DB_PASSWORD in .env}
    volumes:
      - bookstack-data:/config
    ports:
      - "${BOOKSTACK_PORT:-6875}:80"
    networks: [bookstack-db, proxy]
    security_opt: ["no-new-privileges:true"]

networks:
  bookstack-db:
    internal: true
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}

volumes:
  bookstack-db-data:
    name: bookstack-db-data
  bookstack-data:
    name: bookstack-data
