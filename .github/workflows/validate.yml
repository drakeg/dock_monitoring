name: Validate monitoring configuration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      UPTIME_DB_PASSWORD: ci-only-database-password
      UPTIME_DB_ROOT_PASSWORD: ci-only-root-password
      MYSQLD_EXPORTER_PASSWORD: ci-only-exporter-password
      GRAFANA_ADMIN_PASSWORD: ci-only-grafana-password
      ALERTMANAGER_SMTP_PASSWORD: ci-only-smtp-password
      RT_DB_PASSWORD: ci-only-rt-database-password

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare CI Alertmanager configuration
        run: |
          cp alertmanager/alertmanager.yml.example alertmanager/alertmanager.yml
          sed -i \
            -e 's/ALERTMANAGER_EMAIL_TO_PLACEHOLDER/alerts@example.invalid/' \
            -e 's/ALERTMANAGER_EMAIL_FROM_PLACEHOLDER/alerts@example.invalid/' \
            -e 's/ALERTMANAGER_SMTP_USERNAME_PLACEHOLDER/alerts@example.invalid/' \
            alertmanager/alertmanager.yml

      - name: Validate Docker Compose
        run: |
          docker compose config --quiet
          docker compose --profile jenkins config --quiet
          BOOKSTACK_DB_PASSWORD=ci-test-only BOOKSTACK_DB_ROOT_PASSWORD=ci-test-only BOOKSTACK_APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= docker compose -f compose.bookstack.yml config --quiet

      - name: Validate RT configuration files
        run: |
          test -s rt/RT_SiteConfig.pm
          test -s rt/Caddyfile
          bash -n scripts/init-rt.sh
          bash -n scripts/dev-up.sh
          bash -n scripts/backup.sh
          docker run --rm \
            -v "$PWD/rt/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10 \
            caddy validate --config /etc/caddy/Caddyfile

      - name: Validate Prometheus configuration and rules
        run: |
          docker run --rm \
            -v "$PWD/prometheus:/etc/prometheus:ro" \
            --entrypoint /bin/promtool \
            prom/prometheus:latest \
            check config /etc/prometheus/prometheus.yml

      - name: Validate Alertmanager configuration
        run: |
          printf '%s' "$ALERTMANAGER_SMTP_PASSWORD" > /tmp/alertmanager-smtp-password
          docker run --rm \
            -v "$PWD/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            -v "/tmp/alertmanager-smtp-password:/run/secrets/alertmanager_smtp_password:ro" \
            --entrypoint /bin/amtool \
            prom/alertmanager:latest \
            check-config /etc/alertmanager/alertmanager.yml

      - name: Validate Grafana dashboard bootstrap
        run: |
          docker compose run --rm grafana-dashboard-init
          docker run --rm \
            -v grafana-dashboard-data:/dashboards:ro \
            alpine:3.24 \
            /bin/sh -c 'test -s /dashboards/node-exporter-full.json && test -s /dashboards/cadvisor-docker-overview.json && test -s /dashboards/mysql-overview.json'

      - name: Validate repository Grafana dashboards
        run: |
          python -m json.tool grafana/dashboards/monitoring-overview.json >/dev/null

  fresh-development-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare local development configuration
        run: |
          cp .env.example .env
          cp alertmanager/alertmanager.yml.example alertmanager/alertmanager.yml
          sed -i \
            -e 's/ALERTMANAGER_EMAIL_TO_PLACEHOLDER/alerts@example.invalid/' \
            -e 's/ALERTMANAGER_EMAIL_FROM_PLACEHOLDER/alerts@example.invalid/' \
            -e 's/ALERTMANAGER_SMTP_USERNAME_PLACEHOLDER/alerts@example.invalid/' \
            alertmanager/alertmanager.yml

      - name: Start clean development deployment
        run: bash scripts/dev-up.sh

      - name: Verify RT and exporters
        run: |
          docker compose ps
          # Compose startup does not imply application health: allow warm-up.
          for service in rt rt-web rt-db docker-exporter uptime-db uptime-kuma; do
            ready=false
            for attempt in $(seq 1 60); do
              if [ "$(docker inspect -f '{{.State.Health.Status}}' "$service")" = healthy ]; then
                ready=true
                break
              fi
              sleep 3
            done
            if [ "$ready" != true ]; then
              echo "::error::$service did not become healthy"
              exit 1
            fi
          done
          docker exec rt-db psql -U rt -d rt -Atqc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'" | awk '$1 > 0 {ok=1} END {exit !ok}'
          # Derive the actual network rather than assuming a Compose project name.
          network="$(docker inspect mysqld-exporter --format '{{range $name, $network := .NetworkSettings.Networks}}{{println $name}}{{end}}' | head -n 1)"
          for attempt in $(seq 1 30); do
            if docker run --rm --network "$network" curlimages/curl:8.16.0 -fsS http://mysqld-exporter:9104/metrics -o /dev/stdout | grep -q '^mysql_up 1'; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              echo "::error::MySQL exporter did not report mysql_up=1"
              exit 1
            fi
            sleep 3
          done

      - name: Verify repeat deployment preserves RT data
        run: |
          before="$(docker exec rt-db psql -U rt -d rt -Atqc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")"
          bash scripts/dev-up.sh
          after="$(docker exec rt-db psql -U rt -d rt -Atqc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")"
          test "$before" = "$after"
          test "$(docker inspect -f '{{.State.Health.Status}}' rt)" = healthy

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --tail=80 rt rt-db rt-web uptime-db mysqld-exporter docker-exporter || true
