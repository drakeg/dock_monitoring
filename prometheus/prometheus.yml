global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: container-metrics
    static_configs:
      - targets:
          - docker-exporter:9713

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: traefik
    static_configs:
      - targets:
          - traefik:8082

  - job_name: mariadb
    static_configs:
      - targets:
          - mysqld-exporter:9104
