name: infrastructure

services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      NETWORKS: "1"
      SERVICES: "1"
      TASKS: "1"
      EVENTS: "1"
      INFO: "1"
      VERSION: "1"
      PING: "1"
      POST: "0"
      DELETE: "0"
      AUTH: "0"
      SECRETS: "0"
      CONFIGS: "0"
      IMAGES: "0"
      VOLUMES: "0"
      EXEC: "0"
      SYSTEM: "0"
    volumes:
      # Host socket is configurable for rootful/rootless Docker.
      - type: bind
        source: ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
    networks:
      - docker-api
    security_opt:
      - no-new-privileges:true
      - label=disable

  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    depends_on:
      - docker-socket-proxy
    command:
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://docker-socket-proxy:2375"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=${PROXY_NETWORK:-proxy}"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--log.level=${TRAEFIK_LOG_LEVEL:-INFO}"
      - "--accesslog=true"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entrypoint=metrics"
      - "--entrypoints.metrics.address=:8082"
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
    networks:
      - proxy
      - monitoring
      - docker-api
    security_opt:
      - no-new-privileges:true

  dockge:
    image: louislam/dockge:1
    container_name: dockge
    restart: unless-stopped
    environment:
      DOCKGE_STACKS_DIR: /opt/docker
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-America/New_York}
    volumes:
      # Host socket is configurable for rootful/rootless Docker.
      - type: bind
        source: ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}
        target: /var/run/docker.sock
        bind:
          create_host_path: false
      - /opt/docker:/opt/docker
      - dockge-data:/app/data
    ports:
      - "${DOCKGE_PORT:-5001}:5001"
    networks:
      - proxy
    labels:
      - "traefik.enable=${ENABLE_PROXY_LABELS:-true}"
      - "traefik.docker.network=${PROXY_NETWORK:-proxy}"
      - "traefik.http.routers.dockge.rule=Host(`${DOCKGE_HOSTNAME:-dockge.home}`)"
      - "traefik.http.routers.dockge.entrypoints=web"
      - "traefik.http.services.dockge.loadbalancer.server.port=5001"
    security_opt:
      - no-new-privileges:true

  uptime-db:
    image: mariadb:12.3
    container_name: uptime-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${UPTIME_DB_NAME:-uptime_kuma}
      MARIADB_USER: ${UPTIME_DB_USER:-uptime_kuma}
      MARIADB_PASSWORD: ${UPTIME_DB_PASSWORD:?Set UPTIME_DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${UPTIME_DB_ROOT_PASSWORD:?Set UPTIME_DB_ROOT_PASSWORD in .env}
    volumes:
      - uptime-db-data:/var/lib/mysql
    networks:
      - uptime-db
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      start_period: 5m
      interval: 15s
      timeout: 10s
      retries: 10
    security_opt:
      - no-new-privileges:true

  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    container_name: mysqld-exporter
    restart: unless-stopped
    depends_on:
      uptime-db:
        condition: service_healthy
    command:
      - "--mysqld.address=uptime-db:3306"
      - "--mysqld.username=${MYSQLD_EXPORTER_USER:-exporter}"
      - "--exporter.max_open_connections=2"
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQLD_EXPORTER_PASSWORD:?Set MYSQLD_EXPORTER_PASSWORD in .env}
    networks:
      - uptime-db
      - monitoring
    security_opt:
      - no-new-privileges:true

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    depends_on:
      uptime-db:
        condition: service_healthy
    environment:
      UPTIME_KUMA_DB_TYPE: mariadb
      UPTIME_KUMA_DB_HOSTNAME: uptime-db
      UPTIME_KUMA_DB_PORT: "3306"
      UPTIME_KUMA_DB_NAME: ${UPTIME_DB_NAME:-uptime_kuma}
      UPTIME_KUMA_DB_USERNAME: ${UPTIME_DB_USER:-uptime_kuma}
      UPTIME_KUMA_DB_PASSWORD: ${UPTIME_DB_PASSWORD:?Set UPTIME_DB_PASSWORD in .env}
    volumes:
      - uptime-kuma-data:/app/data
    ports:
      - "${UPTIME_KUMA_PORT:-3001}:3001"
    networks:
      - proxy
      - monitoring
      - uptime-db
    labels:
      - "traefik.enable=${ENABLE_PROXY_LABELS:-true}"
      - "traefik.docker.network=${PROXY_NETWORK:-proxy}"
      - "traefik.http.routers.uptime.rule=Host(`${UPTIME_HOSTNAME:-uptime.home}`)"
      - "traefik.http.routers.uptime.entrypoints=web"
      - "traefik.http.services.uptime.loadbalancer.server.port=3001"
    security_opt:
      - no-new-privileges:true

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - type: bind
        source: ./alertmanager/alertmanager.yml
        target: /etc/alertmanager/alertmanager.yml
        read_only: true
        bind:
          create_host_path: false
          selinux: Z
      - alertmanager-data:/alertmanager
    secrets:
      - alertmanager_smtp_password
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}"
      - "--web.enable-lifecycle"
      - "--web.listen-address=0.0.0.0:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - ./prometheus/rules:/etc/prometheus/rules:ro,Z
      - prometheus-data:/prometheus
    ports:
      - "9091:9090"
    networks:
      - monitoring
    depends_on:
      - docker-exporter
      - node-exporter
      - alertmanager
    security_opt:
      - no-new-privileges:true

  docker-exporter:
    image: ghcr.io/dlepaux/docker-exporter:latest
    container_name: docker-exporter
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      # cAdvisor expects the Docker API and data root at these conventional
      # container paths. Map the host's rootful/rootless locations here.
      - type: bind
        source: ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
      - ${DOCKER_DATA_ROOT:-/var/lib/docker}:/var/lib/docker:ro
      - /etc/machine-id:/etc/machine-id:ro
    devices:
      - /dev/kmsg:/dev/kmsg
    networks:
      - monitoring
    security_opt:
      - label=disable

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /:/host:ro,rslave
    pid: host
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true
      - label=disable

  grafana-dashboard-init:
    image: alpine:3.24
    container_name: grafana-dashboard-init
    restart: "no"
    command:
      - /bin/sh
      - -c
      - apk add --no-cache wget >/dev/null && /bin/sh /scripts/fetch-grafana-dashboards.sh /dashboards
    volumes:
      - ./scripts/fetch-grafana-dashboards.sh:/scripts/fetch-grafana-dashboards.sh:ro,Z
      - grafana-dashboard-data:/dashboards
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3002}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/home/monitoring-overview.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./grafana/dashboards:/etc/grafana/home:ro,Z
      - grafana-dashboard-data:/var/lib/grafana/provisioned-dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    networks:
      - proxy
      - monitoring
    depends_on:
      prometheus:
        condition: service_started
      grafana-dashboard-init:
        condition: service_completed_successfully
    labels:
      - "traefik.enable=${ENABLE_PROXY_LABELS:-true}"
      - "traefik.docker.network=${PROXY_NETWORK:-proxy}"
      - "traefik.http.routers.grafana.rule=Host(`${GRAFANA_HOSTNAME:-grafana.home}`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    security_opt:
      - no-new-privileges:true

  rt-db:
    image: postgres:18
    container_name: rt-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${RT_DB_NAME:-rt}
      POSTGRES_USER: ${RT_DB_USER:-rt}
      POSTGRES_PASSWORD: ${RT_DB_PASSWORD:?Set RT_DB_PASSWORD in .env}
    volumes:
      - rt-db-data:/var/lib/postgresql
    networks:
      - rt-db
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "${RT_DB_USER:-rt}" -d "${RT_DB_NAME:-rt}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  rt:
    image: firefart/requesttracker:6.0.3
    container_name: rt
    restart: unless-stopped
    depends_on:
      rt-db:
        condition: service_healthy
    environment:
      RT_WEB_URL: ${RT_WEB_URL:-http://localhost:8088/}
      RT_NAME: ${RT_NAME:-infrastructure}
      RT_ORGANIZATION: ${RT_ORGANIZATION:-example.invalid}
      RT_DB_NAME: ${RT_DB_NAME:-rt}
      RT_DB_USER: ${RT_DB_USER:-rt}
      RT_DB_PASSWORD: ${RT_DB_PASSWORD:?Set RT_DB_PASSWORD in .env}
      TZ: ${TZ:-America/New_York}
    volumes:
      - ./rt/RT_SiteConfig.pm:/opt/rt/etc/RT_SiteConfig.pm:ro,Z
      - rt-data:/opt/rt/var
    networks:
      - rt-db
      - rt-web
    security_opt:
      - no-new-privileges:true

  rt-web:
    image: caddy:2.10
    container_name: rt-web
    restart: unless-stopped
    depends_on:
      rt:
        condition: service_healthy
    volumes:
      - ./rt/Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - rt-caddy-data:/data
      - rt-caddy-config:/config
    ports:
      - "${RT_PORT:-8088}:8080"
    networks:
      - rt-web
      - proxy
      - monitoring
    labels:
      - "traefik.enable=${ENABLE_PROXY_LABELS:-true}"
      - "traefik.docker.network=${PROXY_NETWORK:-proxy}"
      - 'traefik.http.routers.rt.rule=Host(`${RT_HOSTNAME:-rt.home}`)'
      - "traefik.http.routers.rt.entrypoints=web"
      - "traefik.http.services.rt.loadbalancer.server.port=8080"
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:8080/healthz
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true


networks:
  proxy:
    name: ${PROXY_NETWORK:-proxy}
  # Do not mark monitoring internal. Rootless Docker may retain published-port
  # metadata without actually publishing the port when attached only to an
  # internal network. See README.md.
  monitoring:
    name: ${MONITORING_NETWORK:-monitoring}
  docker-api:
    name: docker-api
    internal: true
  uptime-db:
    name: uptime-db
    internal: true
  rt-db:
    name: rt-db
    internal: true
  rt-web:
    name: rt-web

volumes:
  prometheus-data:
    name: prometheus-data
  grafana-data:
    name: grafana-data
  grafana-dashboard-data:
    name: grafana-dashboard-data
  uptime-kuma-data:
    name: uptime-kuma-data
  uptime-db-data:
    name: uptime-db-data
  dockge-data:
    name: dockge-data
  alertmanager-data:
    name: alertmanager-data
  rt-db-data:
    name: rt-db-data
  rt-data:
    name: rt-data
  rt-caddy-data:
    name: rt-caddy-data
  rt-caddy-config:
    name: rt-caddy-config

secrets:
  alertmanager_smtp_password:
    environment: ALERTMANAGER_SMTP_PASSWORD
