name: infrastructure

services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      NETWORKS: "1"
      SERVICES: "1"
      TASKS: "1"
      EVENTS: "1"
      INFO: "1"
      VERSION: "1"
      PING: "1"
      POST: "0"
      DELETE: "0"
      AUTH: "0"
      SECRETS: "0"
      CONFIGS: "0"
      IMAGES: "0"
      VOLUMES: "0"
      EXEC: "0"
      SYSTEM: "0"
    volumes:
      # Rootful/default Docker socket. Rootless hosts may use
      # /run/user/<uid>/docker.sock instead; see README.md.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    security_opt:
      - no-new-privileges:true
      - label=disable

  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    depends_on:
      - docker-socket-proxy
    command:
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://docker-socket-proxy:2375"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=${PROXY_NETWORK:-proxy}"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--log.level=${TRAEFIK_LOG_LEVEL:-INFO}"
      - "--accesslog=true"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entrypoint=metrics"
      - "--entrypoints.metrics.address=:8082"
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
    networks:
      - proxy
      - monitoring
      - docker-api
    security_opt:
      - no-new-privileges:true

  dockge:
    image: louislam/dockge:1
    container_name: dockge
    restart: unless-stopped
    environment:
      DOCKGE_STACKS_DIR: /opt/docker
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-America/New_York}
    volumes:
      # Rootful/default Docker socket. Rootless hosts may use
      # /run/user/<uid>/docker.sock instead; see README.md.
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/docker:/opt/docker
      - dockge-data:/app/data
    ports:
      - "${DOCKGE_PORT:-5001}:5001"
    networks:
      - proxy
    labels:
      - "traefik.enable=${ENABLE_PROXY_LABELS:-true}"
      - "traefik.docker.network=${PROXY_NETWORK:-proxy}"
      - "traefik.http.routers.dockge.rule=Host(\`${DOCKGE_HOSTNAME:-dockge.home}\`)"
      - "traefik.http.routers.dockge.entrypoints=web"
      - "traefik.http.services.dockge.loadbalancer.server.port=5001"
    security_opt:
      - no-new-privileges:true

  uptime-db:
    image: mariadb:11
    container_name: uptime-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${UPTIME_DB_NAME:-uptime_kuma}
      MARIADB_USER: ${UPTIME_DB_USER:-uptime_kuma}
      MARIADB_PASSWORD: ${UPTIME_DB_PASSWORD:?Set UPTIME_DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${UPTIME_DB_ROOT_PASSWORD:?Set UPTIME_DB_ROOT_PASSWORD in .env}
    volumes:
      - uptime-db-data:/var/lib/mysql
    networks:
      - uptime-db
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      start_period: 5m
      interval: 15s
      timeout: 10s
      retries: 10
    security_opt:
      - no-new-privileges:true

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    depends_on:
      uptime-db:
        condition: service_healthy
    environment:
      UPTIME_KUMA_DB_TYPE: mariadb
      UPTIME_KUMA_DB_HOSTNAME: uptime-db
      UPTIME_KUMA_DB_PORT: "3306"
      UPTIME_KUMA_DB_NAME: ${UPTIME_DB_NAME:-uptime_kuma}
      UPTIME_KUMA_DB_USERNAME: ${UPTIME_DB_USER:-uptime_kuma}
      UPTIME_KUMA_DB_PASSWORD: ${UPTIME_DB_PASSWORD:?Set UPTIME_DB_PASSWORD in .env}
    volumes:
      - uptime-kuma-data:/app/data
    ports:
      - "${UPTIME_KUMA_PORT:-3001}:3001"
    networks:
      - proxy
      - monitoring
      - uptime-db
    labels:
      - "traefik.enable=${ENABLE_PROXY_LABELS:-true}"
      - "traefik.docker.network=${PROXY_NETWORK:-proxy}"
      - "traefik.http.routers.uptime.rule=Host(\`${UPTIME_HOSTNAME:-uptime.home}\`)"
      - "traefik.http.routers.uptime.entrypoints=web"
      - "traefik.http.services.uptime.loadbalancer.server.port=3001"
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}"
      - "--web.enable-lifecycle"
      - "--web.listen-address=0.0.0.0:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - prometheus-data:/prometheus
    ports:
      - "9091:9090"
    networks:
      - monitoring
    depends_on:
      - cadvisor
      - node-exporter
    security_opt:
      - no-new-privileges:true

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /etc/machine-id:/etc/machine-id:ro
    devices:
      - /dev/kmsg:/dev/kmsg
    networks:
      - monitoring
    security_opt:
      - label=disable

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /:/host:ro,rslave
    pid: host
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true
      - label=disable

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3002}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,Z
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    networks:
      - proxy
      - monitoring
    depends_on:
      - prometheus
    labels:
      - "traefik.enable=${ENABLE_PROXY_LABELS:-true}"
      - "traefik.docker.network=${PROXY_NETWORK:-proxy}"
      - "traefik.http.routers.grafana.rule=Host(\`${GRAFANA_HOSTNAME:-grafana.home}\`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    security_opt:
      - no-new-privileges:true

networks:
  proxy:
    name: ${PROXY_NETWORK:-proxy}
  # Do not mark monitoring internal. Rootless Docker may retain published-port
  # metadata without actually publishing the port when attached only to an
  # internal network. See README.md.
  monitoring:
    name: ${MONITORING_NETWORK:-monitoring}
  docker-api:
    name: docker-api
    internal: true
  uptime-db:
    name: uptime-db
    internal: true

volumes:
  prometheus-data:
    name: prometheus-data
  grafana-data:
    name: grafana-data
  uptime-kuma-data:
    name: uptime-kuma-data
  uptime-db-data:
    name: uptime-db-data
  dockge-data:
    name: dockge-data
